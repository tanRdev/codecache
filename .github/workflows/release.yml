name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build:cli
      - name: Pack CLI
        run: |
          mkdir -p release
          npm pack --workspace @tanrdev/cache --pack-destination release
          mv release/tanrdev-cache-*.tgz release/codecache-cli.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/codecache-cli.tgz --generate-notes --title "${GITHUB_REF_NAME}"
