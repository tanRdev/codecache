name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test
      - run: npm run build:cli
      - run: npm pack --workspace @tanrdev/cache --dry-run
      - run: npm run build
        env:
          NEXT_PUBLIC_DEPLOYMENT_MODE: marketing
          NEXT_PUBLIC_SITE_URL: https://cache.example
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
